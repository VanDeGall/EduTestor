<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ŠDK Strategický AI Asistent</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>ŠDK Strategický AI Asistent</h1>
      <p>Lokálny MVP prototyp: evidencia práce, výstupy, termíny a podklady pre vedenie</p>
    </div>
    <nav>
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('leadership') }}">Vedenie</a>
      <a href="{{ url_for('deadlines') }}">Termíny</a>
      <a href="{{ url_for('evidence') }}">Dôkazy</a>
      <a href="{{ url_for('settings') }}">Nastavenia</a>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <aside class="avatar">
    <div class="avatar-dot"></div>
    <div>
      <strong>ŠDK Agent</strong>
      <small>Pripravený</small>
    </div>
  </aside>
</body>
</html>
